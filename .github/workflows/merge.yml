name: Merge Workflow

# Standard merge pipeline: quality gate + version creation, then request a
# deployment of the lowest environment (production) by opening a PR that
# bumps its environments/<env>/deployed.json. Actual terraform plan/apply
# happens in pull-request-deploy.yml / merge-deploy.yml once that PR is
# opened/merged. See /ARCHITECTURE.md.

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/merge.yml'

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    name: Quality Gate | Core
    steps:
      - uses: 24dlong/github-actions-library/actions/quality-gate@v4

  publish:
    name: Create Version
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: 24dlong/github-actions-library/actions/publish@v4
        with:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  request-deployment:
    name: Request Deployment
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: 24dlong/github-actions-library/actions/terraform/deployment-pr@v4
        with:
          environment: production
          ref: ${{ steps.publish.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-branch: main
