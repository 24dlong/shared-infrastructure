name: Merge Workflow

# Standard merge pipeline: quality gate + version creation, then request a
# deployment of the lowest environment (production) by opening a PR that
# bumps its environments/<env>/deployed.json. Actual terraform plan/apply
# happens in pull-request-deploy.yml / merge-deploy.yml once that PR is
# opened/merged. See /ARCHITECTURE.md.

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/merge.yml'

permissions:
  contents: read

jobs:
  publish:
    name: Create Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - id: publish
        uses: 24dlong/github-actions-library/actions/publish@v5
        with:
          # requried to bypass branch protection
          GITHUB_WORKFLOWS_CLIENT_ID: ${{ vars.GH_WORKFLOWS_APP_CLIENT_ID }}
          GITHUB_WORKFLOWS_PRIVATE_KEY: ${{ secrets.GH_WORKFLOWS_APP_PRIVATE_KEY }}

  request-deployment:
    name: Request Deployment
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: 24dlong/github-actions-library/actions/terraform/deployment-pr@v5
        with:
          environment: production
          ref: ${{ needs.publish.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-branch: main
