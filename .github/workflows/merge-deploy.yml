name: Apply Changes Workflow

# Thin wrapper: trigger only. Detect, fan-out, GitHub Environment vars, and
# terraform apply live in github-actions-library terraform-deploy.yml.
# Adding an environment is environments/<env>/deployed.json plus a GitHub
# Environment named <env> — no changes here.

on:
  push:
    branches:
      - main
    paths:
      - "environments/**/deployed.json"

permissions:
  contents: read

jobs:
  apply:
    name: Apply Changes
    uses: 24dlong/github-actions-library/.github/workflows/terraform-deploy.yml@v5
    permissions:
      id-token: write
      contents: read
      actions: write
      pull-requests: write
    secrets:
      github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      command: apply
      working-directory: infra
      plan-workflow-file: pull-request-deploy.yml
