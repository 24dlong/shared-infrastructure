name: Debug Token

on:
  push:
    branches:
      - fix-ci

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GITHUB_TOKEN access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: 19e618413502b837b948156bce32c1f05f59ee29
        run: |
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_SHA (runner)=${GITHUB_SHA}"
          echo "TARGET_SHA (main commit with PR)=${TARGET_SHA}"
          echo "--- gh api user (token identity) ---"
          gh api /rate_limit --jq '.resources.core' || true
          echo "--- raw curl with -i to see status/body for TARGET_SHA ---"
          curl -s -i \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls"
          echo ""
          echo "--- gh api (same call apply action makes) for TARGET_SHA ---"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls" --jq '.[0]' || true
