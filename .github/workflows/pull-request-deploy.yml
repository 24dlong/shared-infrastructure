name: Plan Changes Workflow

# Thin wrapper: trigger only. Detect, fan-out, GitHub Environment vars, and
# terraform plan live in github-actions-library terraform-deploy.yml.
# Adding an environment is environments/<env>/deployed.json plus a GitHub
# Environment named <env> — no changes here.

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/**/deployed.json"

permissions:
  contents: read

jobs:
  plan:
    name: Plan Changes
    uses: 24dlong/github-actions-library/.github/workflows/terraform-deploy.yml@v5
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: write
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      github-app-client-id: ${{ vars.GH_WORKFLOWS_APP_CLIENT_ID }}
      github-app-private-key: ${{ secrets.GH_WORKFLOWS_APP_PRIVATE_KEY }}
    with:
      command: plan
      working-directory: infra
