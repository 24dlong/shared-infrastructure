name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve merged PR and matching plan artifact
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PLAN_WORKFLOW_FILE: "pull-request.yml"
        run: |
          set -euo pipefail

          echo "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"

          PR_JSON="$(gh api repos/${GITHUB_REPOSITORY}/commits/19e618413502b837b948156bce32c1f05f59ee29/pulls --jq '.[0]')"
          PR_NUMBER="$(echo "$PR_JSON" | jq -r '.number')"
          PR_HEAD_SHA="$(echo "$PR_JSON" | jq -r '.head.sha')"

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No PR found for commit ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo repos/${GITHUB_REPOSITORY}/actions/workflows/${PLAN_WORKFLOW_FILE}/runs
          RUN_ID="$(gh api repos/${GITHUB_REPOSITORY}/actions/workflows/${PLAN_WORKFLOW_FILE}/runs \
            -f event=pull_request -f status=completed --jq \
            ".workflow_runs[] | select(.conclusion == \"success\" and .head_sha == \"${PR_HEAD_SHA}\") | .id" | head -n 1)"

          if [ -z "$RUN_ID" ]; then
            echo "No successful pull_request workflow run found for PR head sha ${PR_HEAD_SHA}." >&2
            exit 1
          fi

          ARTIFACT_NAME="tfplan-pr-${PR_NUMBER}-${PR_HEAD_SHA}"

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
