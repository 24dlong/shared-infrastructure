name: Pull Request Workflow

# Standard PR pipeline: quality gate only. Terraform plan/apply for infra/
# is handled exclusively by pull-request-deploy.yml / merge-deploy.yml,
# triggered by changes to environments/**/deployed.json. See /ARCHITECTURE.md.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    name: Quality Gate | Core
    steps:
      - uses: 24dlong/github-actions-library/actions/quality-gate@v5
